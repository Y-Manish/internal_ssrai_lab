name: CMake Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Compile and Verify Project
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-error=unused-but-set-variable"

    - name: Build Project
      run: cmake --build ${{ github.workspace }}/build --config Release

    - name: Run Tests
      run: |
        cd ${{ github.workspace }}/build
        ctest --output-on-failure
